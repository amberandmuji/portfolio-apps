<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}*,*::before,*::after{box-sizing:border-box}</style>
<title>Chicago Matcha Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kaisei+Decol:wght@500;700&family=Klee+One:wght@400;600&family=Zen+Maru+Gothic:wght@400;500;700&family=Yuji+Syuku&display=swap">
<style>
/* Layout: a hand-painted washi map fills the top; a paper drawer of spots below (side by side on wide screens).
   Deliberately single-theme: one daylight watercolor world on any host. */
:root{
  color-scheme:light;
  --washi:#f4ecd8; --washi-2:#fbf6ea; --sumi:#3b3226; --sumi-soft:#7a6a55; --line:#ddcfb2;
  --matcha:#7d9b4a; --matcha-deep:#4d6b2c; --shu:#c4553a; --sora:#8fbfcc; --you:#3f78b5; --chip:#ece1c6;
  --brush:"Yuji Syuku","Kaisei Decol",serif;
  --display:"Kaisei Decol","Hiragino Mincho ProN",Georgia,serif;
  --hand:"Klee One","Zen Maru Gothic",system-ui,sans-serif;
  --body:"Zen Maru Gothic",system-ui,-apple-system,"Segoe UI",sans-serif;
}
html,body{height:100%}
body{background:var(--washi);color:var(--sumi);font-family:var(--body);font-size:15px;line-height:1.5}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
:focus-visible{outline:2px dashed var(--shu);outline-offset:2px}
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto var(--drawer-h,44%)}
.handle{position:relative;z-index:5;height:20px;background:var(--washi-2);border-top:1.5px solid var(--line);cursor:row-resize;touch-action:none;display:grid;place-items:center;user-select:none;-webkit-user-select:none}
.handle::before{content:"";position:absolute;inset:-12px 0}
.handle span{width:52px;height:5px;border-radius:3px;background:var(--sumi-soft);opacity:.45;transition:opacity .15s}
.handle:hover span,.handle.dragging span{opacity:.9;background:var(--shu)}
body.resizing{cursor:row-resize;user-select:none;-webkit-user-select:none}
body.resizing.cols{cursor:col-resize}
body.resizing #map,body.resizing .drawer{pointer-events:none}
header{display:flex;align-items:center;gap:12px;padding:10px 16px 8px;background:var(--washi-2);border-bottom:1.5px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.hanko{font-family:var(--brush);color:var(--washi-2);background:var(--shu);border-radius:8px;width:40px;height:40px;display:grid;place-items:center;font-size:24px;line-height:1;flex:none;transform:rotate(-4deg);box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.brand h1{font-family:var(--display);font-weight:700;font-size:21px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.01em}
.brand small{display:block;overflow:hidden;text-overflow:ellipsis;color:var(--sumi-soft);font-family:var(--hand);font-size:12px;white-space:nowrap}
.locate{display:flex;align-items:center;gap:6px;border:1.5px solid var(--sumi);background:var(--washi);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;box-shadow:2px 2px 0 var(--line)}
.locate svg{width:16px;height:16px}
.locate.on{border-color:var(--you);color:var(--you)}
.mapwrap{position:relative;overflow:hidden;background:#a8cdd6;touch-action:none;min-height:0;min-width:0;container-type:size;container-name:map}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
.mapwrap.placing #map{cursor:crosshair}
#pins{position:absolute;inset:0;pointer-events:none}
.pin{position:absolute;left:0;top:0;pointer-events:auto;border:0;background:none;padding:0;cursor:pointer;transform-origin:50% 100%}
.pin .bowl{display:block;width:34px;height:30px;filter:drop-shadow(1px 2px 0 rgba(59,50,38,.25))}
.pin .num{position:absolute;left:0;right:0;top:11px;line-height:1;text-align:center;font-family:var(--hand);font-weight:600;font-size:12px;color:var(--sumi)}
.pin.v .num{color:#fffaf0}
.pin .num{font-size:11px}
.pin .tag{position:absolute;left:36px;top:5px;white-space:nowrap;font-family:var(--hand);font-weight:600;font-size:13px;color:var(--sumi);background:rgba(251,246,234,.92);border:1px solid var(--line);border-radius:6px;padding:0 6px;pointer-events:none}
.pin.sel{z-index:3}
.pin.sel .bowl{transform:scale(1.25);transform-origin:50% 100%}
.me{position:absolute;left:0;top:0;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:var(--you);border:3px solid #fff;box-shadow:0 0 0 7px rgba(63,120,181,.22);pointer-events:none}
.maptools{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px;z-index:4}
.maptools button{width:38px;height:38px;border-radius:12px;border:1.5px solid var(--sumi);background:var(--washi-2);font-size:19px;cursor:pointer;box-shadow:2px 2px 0 rgba(59,50,38,.18);line-height:1}
.toast{position:absolute;left:12px;right:62px;bottom:12px;background:var(--washi-2);border:1.5px solid var(--sumi);border-radius:12px;padding:10px 12px;font-size:13px;z-index:4;box-shadow:3px 3px 0 rgba(59,50,38,.15)}
.toast b{color:var(--you)}
.legend{position:absolute;left:12px;bottom:12px;display:flex;gap:10px;font-family:var(--hand);font-size:12px;color:var(--sumi);background:rgba(251,246,234,.9);padding:4px 10px;border-radius:10px;border:1px solid var(--line);z-index:2;align-items:center}
.legend svg{width:18px;height:15px;vertical-align:-3px;margin-right:3px}
.drawer{overflow:auto;min-height:0;min-width:0;background:var(--washi-2);overscroll-behavior:contain}
.controls{position:sticky;top:0;z-index:2;background:var(--washi-2);padding:12px 16px 10px;display:flex;flex-direction:column;gap:8px;border-bottom:1.5px dashed var(--line)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 11px;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;color:var(--sumi-soft)}
.seg button[aria-pressed="true"]{background:var(--washi-2);color:var(--sumi);box-shadow:1px 1px 0 var(--line)}
.chip{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:4px 11px;font-size:12px;font-weight:500;cursor:pointer;color:var(--sumi-soft)}
.chip[aria-pressed="true"]{background:var(--matcha-deep);color:#fffaf0;border-color:var(--matcha-deep)}
.count{margin-left:auto;font-family:var(--hand);font-size:13px;color:var(--sumi-soft)}
ol.list{list-style:none;margin:0;padding:4px 0 24px}
.spot{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;padding:12px 16px;border-bottom:1px dashed var(--line);cursor:pointer;align-items:start}
.spot:hover,.spot.sel{background:#f3ead2}
.rank{font-family:var(--brush);font-size:24px;color:var(--matcha-deep);text-align:center;line-height:1.1}
.spot h3{margin:0;font-family:var(--display);font-size:17px;font-weight:700;min-width:0}
.meta{font-size:12px;color:var(--sumi-soft)}
.order{font-size:13px;margin-top:3px}
.order em{font-style:normal;color:var(--shu);font-weight:700}
.dist{font-family:var(--hand);font-size:13px;color:var(--sumi-soft);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.badge{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:1px 7px;margin-top:5px}
.badge.v{background:var(--matcha);color:#fffaf0}
.badge.w{border:1px solid var(--line);color:var(--sumi-soft)}
.bowls{color:var(--matcha-deep);letter-spacing:1px;font-size:12px}
.sheet{position:fixed;inset:auto 0 0 0;max-height:82%;overflow:auto;background:var(--washi-2);border-top:2px solid var(--sumi);border-top-left-radius:22px;border-top-right-radius:22px;box-shadow:0 -8px 30px rgba(59,50,38,.22);padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));z-index:10;transition:transform .25s ease}
.sheet[hidden]{display:block!important;transform:translateY(105%);visibility:hidden}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet .top{display:flex;gap:10px;align-items:flex-start}
.sheet h2{font-family:var(--display);font-weight:700;font-size:25px;margin:0;line-height:1.2;text-wrap:balance;flex:1}
.close{border:1.5px solid var(--sumi);background:var(--washi);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:14px;flex:none}
.addr{color:var(--sumi-soft);font-size:13px;margin:4px 0 10px}
.why{margin:0 0 10px;max-width:62ch}
.sources{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.src{font-family:var(--hand);font-size:12px;background:var(--chip);border-radius:6px;padding:2px 8px}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.links a{font-size:13px;font-weight:700;color:var(--matcha-deep);text-decoration:none;border:1.5px solid var(--matcha-deep);border-radius:999px;padding:6px 13px}
.log{border:1.5px solid var(--sumi);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--washi);box-shadow:3px 3px 0 var(--line)}
.log h4{margin:0;font-family:var(--display);font-size:17px}
.toggle{display:flex;gap:6px}
.toggle button{flex:1;border:1.5px solid var(--line);background:var(--washi-2);border-radius:12px;padding:9px;font-weight:700;cursor:pointer;font-size:14px}
.toggle button[aria-pressed="true"]{background:var(--matcha);border-color:var(--matcha-deep);color:#fffaf0}
.rate{display:flex;gap:4px;align-items:center}
.rate button{border:0;background:transparent;cursor:pointer;padding:2px;line-height:0}
.rate svg{width:32px;height:26px}
.rate .lbl{font-family:var(--hand);font-size:13px;color:var(--sumi-soft);margin-left:6px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--sumi-soft);font-weight:700}
textarea,input[type=date]{font:inherit;font-family:var(--hand);font-size:15px;color:var(--sumi);background:var(--washi-2);border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
textarea{min-height:88px;resize:vertical;background-image:repeating-linear-gradient(transparent 0 25px,var(--line) 25px 26px);line-height:26px}
.saved{font-family:var(--hand);font-size:12px;color:var(--sumi-soft);min-height:1em}
.store{font-size:11px;color:var(--sumi-soft);padding:12px 16px 0}
.scrim{position:fixed;inset:0;background:rgba(59,50,38,.2);z-index:9}
@media (max-width:480px){
  header{gap:8px;padding-inline:12px}
  .hanko{width:34px;height:34px;font-size:20px}
  .brand h1{font-size:18px}
  .locate{padding:8px}
  .locate span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .controls{padding-inline:12px}
  .spot{padding-inline:12px;gap:10px;grid-template-columns:28px minmax(0,1fr) auto}
  .legend{gap:7px;font-size:11px;padding:3px 8px}
  .toast{left:8px;right:56px}
}
@media (min-width:860px){
  .app{grid-template-columns:minmax(0,1fr) auto var(--panel-w,420px);grid-template-rows:auto minmax(0,1fr)}
  header{grid-column:1/-1}
  .handle{height:auto;width:14px;border-top:0;border-left:1.5px solid var(--line);cursor:col-resize}
  .handle::before{inset:0 -10px}
  .handle span{width:5px;height:52px}
  .sheet{left:auto;right:16px;bottom:16px;width:400px;border:2px solid var(--sumi);border-radius:22px;max-height:calc(100% - 100px)}
}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
@container map (max-height:300px){.maptools{flex-direction:row;top:8px;right:8px}.maptools button{width:34px;height:34px}.legend{display:none}}
@container map (max-height:150px){.maptools{display:none}.toast{bottom:6px;padding:6px 10px}}
</style>

</head>
<body>
<div class="app">
  <header>
    <div class="brand"><span class="hanko" aria-hidden="true">茶</span><div style="min-width:0"><h1>Chicago Matcha Map</h1><small id="sub">23 spots · autumn 2026</small></div></div>
    <button class="locate" id="locate" type="button" aria-label="Set my location">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg><span id="locLbl">Locate me</span>
    </button>
  </header>

  <div class="mapwrap" id="mapwrap">
    <canvas id="map" role="img" aria-label="Hand-drawn map of Chicago with matcha spots"></canvas>
    <div id="pins"></div>
    <div class="maptools">
      <button type="button" id="zin" aria-label="Zoom in">+</button>
      <button type="button" id="zout" aria-label="Zoom out">−</button>
      <button type="button" id="zfit" aria-label="Show all spots">⤢</button>
    </div>
    <div class="legend" id="legend"></div>
    <div class="toast" id="toast" hidden></div>
  </div>

  <div class="handle" id="handle" role="separator" tabindex="0" aria-label="Drag to resize the list" aria-orientation="horizontal"><span></span></div>

  <section class="drawer" aria-label="Matcha spots">
    <div class="controls">
      <div class="row">
        <div class="seg" role="group" aria-label="Show">
          <button type="button" data-show="all" aria-pressed="true">All</button>
          <button type="button" data-show="try" aria-pressed="false">To try</button>
          <button type="button" data-show="visited" aria-pressed="false">Visited</button>
        </div>
        <div class="seg" role="group" aria-label="Sort">
          <button type="button" data-sort="rank" aria-pressed="true">Top</button>
          <button type="button" data-sort="near" aria-pressed="false">Nearest</button>
        </div>
      </div>
      <div class="row">
        <button type="button" class="chip" data-style="pure" aria-pressed="false">Straight / usucha</button>
        <button type="button" class="chip" data-style="latte" aria-pressed="false">Lattes</button>
        <button type="button" class="chip" data-style="flavor" aria-pressed="false">Creative flavors</button>
        <button type="button" class="chip" data-style="dessert" aria-pressed="false">Desserts</button>
        <span class="count" id="count"></span>
      </div>
    </div>
    <ol class="list" id="list"></ol>
    <p class="store" id="storeNote"></p>
  </section>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="sheet" id="sheet" hidden aria-label="Spot details"></aside>

}
function isLand(sx,sy){const [x,y]=toWorld(sx,sy);setW();const r=ctx.isPointInPath(P.bound,x*V.z*DPR+DPR*(Wd/2-V.cx*V.z),y*V.z*DPR+DPR*(Ht/2-V.cy*V.z));setS();return r}
function compass(){const x=Wd-34,y=Ht-40;if(Ht<200)return;ctx.save();ctx.translate(x,y);ctx.strokeStyle="#3b3226";ctx.lineWidth=1.4;ctx.beginPath();ctx.arc(0,0,14,0,7);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,-11);ctx.lineTo(4,2);ctx.lineTo(0,-1);ctx.lineTo(-4,2);ctx.closePath();ctx.fillStyle="#c4553a";ctx.fill();ctx.font="700 11px 'Klee One',sans-serif";ctx.fillStyle="#3b3226";ctx.textAlign="center";ctx.fillText("N",0,-21);ctx.restore()}

// ================= Pins (HTML overlay) =================
const pinsEl=document.getElementById("pins");const pinEls={};let meEl=null;
const BOWLSVG=(fill)=>`<svg class="bowl" viewBox="0 0 34 30" aria-hidden="true"><path d="M3 9.5c0-1.3 28-1.3 28 0 0 9.5-6 16.5-14 16.5S3 19 3 9.5z" fill="${fill?"#7d9b4a":"#fbf6ea"}" stroke="#3b3226" stroke-width="1.8" stroke-linejoin="round"/><ellipse cx="17" cy="9.6" rx="14" ry="2.4" fill="${fill?"#a8c26e":"#f1e6cc"}" stroke="#3b3226" stroke-width="1.4"/><path d="M12 26.5h10" stroke="#3b3226" stroke-width="1.8" stroke-linecap="round"/></svg>`;
function buildPins(){pinsEl.innerHTML="";SPOTS.forEach(s=>{const b=document.createElement("button");b.type="button";b.className="pin";b.setAttribute("aria-label",s.rank+". "+s.name);b.dataset.id=s.id;b.onclick=e=>{e.stopPropagation();openSpot(s.id)};b.addEventListener("pointerdown",e=>e.stopPropagation());pinsEl.appendChild(b);pinEls[s.id]=b;s.w=W(s.lng,s.lat)});
  meEl=document.createElement("div");meEl.className="me";meEl.hidden=true;pinsEl.appendChild(meEl);paintPins()}
function paintPins(){const vis=new Set(visible().map(s=>s.id));SPOTS.forEach(s=>{const b=pinEls[s.id];const v=!!state.log[s.id]?.visited;b.hidden=!vis.has(s.id);
  b.className="pin"+(v?" v":"")+(state.sel===s.id?" sel":"");b.innerHTML=BOWLSVG(v)+`<span class="num">${s.rank}</span><span class="tag" ${V.z>.075||state.sel===s.id?"":"hidden"}>${esc(s.name)}</span>`});placePins()}
let lastTagZ=null;
function placePins(){if(!pinsEl.childElementCount)return;const showTag=V.z>.075;
  if(lastTagZ!==showTag){lastTagZ=showTag;Object.values(pinEls).forEach(b=>{const t=b.querySelector(".tag");if(t)t.hidden=!(showTag||b.classList.contains("sel"))})}
  SPOTS.forEach(s=>{const [x,y]=toScr(...s.w);pinEls[s.id].style.transform=`translate(${x-17}px,${y-28}px)`});
  if(state.me){const [x,y]=toScr(...W(state.me.lng,state.me.lat));meEl.hidden=false;meEl.style.transform=`translate(${x}px,${y}px)`}else meEl.hidden=true}

// ================= View control =================
let raf=0;function req(){if(!raf)raf=requestAnimationFrame(()=>{raf=0;draw()})}
const ZMIN=.012,ZMAX=.6;
function zoomAt(f,sx=Wd/2,sy=Ht/2){const [x,y]=toWorld(sx,sy);V.z=Math.min(ZMAX,Math.max(ZMIN,V.z*f));const [x2,y2]=toWorld(sx,sy);V.cx+=x-x2;V.cy+=y-y2;req()}
function fitTo(lls,padPx=48){const pts=lls.map(p=>W(p.lng,p.lat));const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  V.cx=(x0+x1)/2;V.cy=(y0+y1)/2;V.z=Math.min(ZMAX*.5,Math.max(ZMIN,Math.min((Wd-padPx*2)/Math.max(400,x1-x0),(Ht-padPx*2)/Math.max(400,y1-y0))));req()}
function flyTo(ll,z){const t0=performance.now(),a={...V},b=W(ll.lng,ll.lat),zt=z||Math.max(V.z,.1);
  const step=t=>{const k=Math.min(1,(t-t0)/450),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;V.cx=a.cx+(b[0]-a.cx)*e;V.cy=a.cy+(b[1]+60/zt*0-a.cy)*e;V.z=a.z+(zt-a.z)*e;draw();if(k<1)requestAnimationFrame(step)};
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){V.cx=b[0];V.cy=b[1];V.z=zt;req()}else requestAnimationFrame(step)}
const ptrs=new Map();let drag=null,moved=false,pinch=null,lastTap=0;
cv.addEventListener("pointerdown",e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=false;
  if(ptrs.size===1)drag={x:e.clientX,y:e.clientY,cx:V.cx,cy:V.cy};
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];const r=cv.getBoundingClientRect();pinch={d:Math.hypot(a.x-b.x,a.y-b.y),z:V.z,mx:(a.x+b.x)/2-r.left,my:(a.y+b.y)/2-r.top}}});
cv.addEventListener("pointermove",e=>{if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2&&pinch){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);moved=true;zoomAt((pinch.z*d/pinch.d)/V.z,pinch.mx,pinch.my);return}
  if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>4)moved=true;if(moved){V.cx=drag.cx-dx/V.z;V.cy=drag.cy-dy/V.z;req()}}});
function endP(e){ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;if(ptrs.size===1){const [a]=[...ptrs.values()];drag={x:a.x,y:a.y,cx:V.cx,cy:V.cy}}if(!ptrs.size)drag=null}
cv.addEventListener("pointerup",e=>{const was=moved;endP(e);if(was)return;const r=cv.getBoundingClientRect(),sx=e.clientX-r.left,sy=e.clientY-r.top;
  if(state.placing){const [x,y]=toWorld(sx,sy);setMe(toLL(x,y),"pin");return}
  const now=Date.now();if(now-lastTap<320){zoomAt(1.8,sx,sy);lastTap=0}else lastTap=now});
cv.addEventListener("pointercancel",endP);
cv.addEventListener("wheel",e=>{e.preventDefault();const r=cv.getBoundingClientRect();zoomAt(Math.exp(-e.deltaY*.0018),e.clientX-r.left,e.clientY-r.top)},{passive:false});
document.getElementById("zin").onclick=()=>zoomAt(1.6);document.getElementById("zout").onclick=()=>zoomAt(1/1.6);
document.getElementById("zfit").onclick=()=>fitTo(visible().length?visible():SPOTS);
new ResizeObserver(resize).observe(wrap);

// legend
document.getElementById("legend").innerHTML=`<span>${BOWLSVG(true).replace('class="bowl"','')}Visited</span><span>${BOWLSVG(false).replace('class="bowl"','')}To try</span><span><svg viewBox="0 0 18 15"><circle cx="9" cy="7.5" r="5" fill="#3f78b5" stroke="#fff" stroke-width="2"/></svg>You</span>`;

// ================= App state =================
const state={show:"all",sort:"rank",styles:new Set(),sel:null,me:null,placing:false,log:{}};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function miles(a,b){const R=3958.8,r=Math.PI/180,dLa=(b.lat-a.lat)*r,dLo=(b.lng-a.lng)*r;const h=Math.sin(dLa/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h))}

function toast(html){const t=$("#toast");t.innerHTML=html;t.hidden=!html}
function setMe(pos,how){state.me=pos;state.placing=false;wrap.classList.remove("placing");
  $("#locate").classList.add("on");$("#locLbl").textContent=how==="gps"?"Located":"Spot set";toast("");setSort("near");
  const near=[...SPOTS].sort((a,b)=>miles(pos,a)-miles(pos,b)).slice(0,4);fitTo([pos,...near],60)}
$("#locate").onclick=()=>{
  if(state.placing){state.placing=false;wrap.classList.remove("placing");toast("");return}
  const fallback=()=>{state.placing=true;wrap.classList.add("placing");toast("Location access isn't available here. <b>Tap the map</b> where you are and the list sorts by distance.")};
  if(!navigator.geolocation){fallback();return}
  toast("Finding you…");let done=false;const t=setTimeout(()=>{if(!done){done=true;fallback()}},6000);
  try{navigator.geolocation.getCurrentPosition(p=>{if(done)return;done=true;clearTimeout(t);setMe({lat:p.coords.latitude,lng:p.coords.longitude},"gps")},()=>{if(done)return;done=true;clearTimeout(t);fallback()},{enableHighAccuracy:true,timeout:5500,maximumAge:60000})}catch(_){done=true;clearTimeout(t);fallback()}};

function visible(){return SPOTS.filter(s=>{const v=!!state.log[s.id]?.visited;if(state.show==="visited"&&!v)return false;if(state.show==="try"&&v)return false;for(const st of state.styles)if(!s.styles.includes(st))return false;return true})}
function bowls(n){return n?"●".repeat(n)+"○".repeat(5-n):""}
function renderList(){
  let items=visible();if(state.sort==="near"&&state.me)items=[...items].sort((a,b)=>miles(state.me,a)-miles(state.me,b));
  $("#count").textContent=items.length+" / "+SPOTS.length;
  $("#sub").textContent=`${SPOTS.length} spots · ${SPOTS.filter(s=>state.log[s.id]?.visited).length} visited`;
  $("#list").innerHTML=items.length?items.map(s=>{const L=state.log[s.id]||{};const d=state.me?miles(state.me,s).toFixed(1)+" mi":"";
    return `<li class="spot${state.sel===s.id?" sel":""}" data-id="${s.id}" tabindex="0"><div class="rank">${s.rank}</div>
      <div style="min-width:0"><h3>${esc(s.name)}</h3><div class="meta">${esc(s.hood)} · ${esc(s.addr)}</div>
      <div class="order">Order: <em>${esc(s.order)}</em></div>
      ${L.visited?`<span class="badge v">Visited</span> <span class="bowls" aria-label="${L.rating||0} of 5">${bowls(L.rating)}</span>`:`<span class="badge w">To try</span>`}</div>
      <div class="dist">${d}</div></li>`}).join(""):`<li class="spot" style="cursor:default"><div></div><div class="meta">${state.show==="visited"?"No visits logged yet. Open a spot and mark it visited.":"Nothing matches these filters."}</div></li>`;
  $("#list").querySelectorAll("li[data-id]").forEach(li=>{li.onclick=()=>openSpot(li.dataset.id,true);li.onkeydown=e=>{if(e.key==="Enter")openSpot(li.dataset.id,true)}});
  paintPins()}
function setSort(s){state.sort=s;document.querySelectorAll("[data-sort]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.sort===s));renderList()}
document.querySelectorAll("[data-show]").forEach(b=>b.onclick=()=>{state.show=b.dataset.show;document.querySelectorAll("[data-show]").forEach(x=>x.setAttribute("aria-pressed",x===b));renderList()});
document.querySelectorAll("[data-sort]").forEach(b=>b.onclick=()=>{if(b.dataset.sort==="near"&&!state.me){$("#locate").click();return}setSort(b.dataset.sort)});
document.querySelectorAll("[data-style]").forEach(b=>b.onclick=()=>{const k=b.dataset.style;state.styles.has(k)?state.styles.delete(k):state.styles.add(k);b.setAttribute("aria-pressed",state.styles.has(k));renderList()});

const BOWL=on=>`<svg viewBox="0 0 34 30" aria-hidden="true"><path d="M3 9.5c0-1.3 28-1.3 28 0 0 9.5-6 16.5-14 16.5S3 19 3 9.5z" fill="${on?"#7d9b4a":"none"}" stroke="${on?"#3b3226":"#a8987e"}" stroke-width="1.8"/><ellipse cx="17" cy="9.6" rx="14" ry="2.4" fill="${on?"#a8c26e":"none"}" stroke="${on?"#3b3226":"#a8987e"}" stroke-width="1.4"/></svg>`;
function openSpot(id,fly){
  state.sel=id;const s=SPOTS.find(x=>x.id===id);const L=state.log[id]||{};const q=encodeURIComponent(s.name+" "+s.addr+" Chicago IL");const sh=$("#sheet");
  sh.innerHTML=`<div class="grab"></div><div class="top"><h2>${esc(s.name)}</h2><button class="close" id="closeSheet" type="button" aria-label="Close">✕</button></div>
   <div class="addr">${esc(s.addr)}, ${esc(s.hood)}${state.me?` · ${miles(state.me,s).toFixed(1)} mi away`:""}${s.check?` · <em>exact spot unconfirmed</em>`:""}</div>
   <p class="why">${esc(s.why)}</p><div class="order" style="margin-bottom:10px">What to order: <em>${esc(s.order)}</em></div>
   <div class="sources">${s.src.map(x=>`<span class="src">${esc(x)}</span>`).join("")}</div>
   <div class="links"><a href="https://www.google.com/maps/dir/?api=1&destination=${q}" target="_blank" rel="noopener">Directions ↗</a><a href="https://www.google.com/maps/search/?api=1&query=${q}" target="_blank" rel="noopener">Google reviews ↗</a><a href="https://www.instagram.com/explore/search/keyword/?q=${encodeURIComponent(s.name+" chicago matcha")}" target="_blank" rel="noopener">Instagram ↗</a></div>
   <div class="log"><h4>My tea log</h4>
     <div class="toggle" role="group" aria-label="Visit status"><button type="button" id="tTry" aria-pressed="${!L.visited}">Want to try</button><button type="button" id="tVis" aria-pressed="${!!L.visited}">Visited ✓</button></div>
     <div><div class="meta" style="margin-bottom:4px">My rating</div><div class="rate" id="rate">${[1,2,3,4,5].map(n=>`<button type="button" data-n="${n}" aria-label="${n} of 5">${BOWL(n<=(L.rating||0))}</button>`).join("")}<span class="lbl">${L.rating?L.rating+" / 5":"tap a bowl"}</span></div></div>
     <label class="f" for="vdate">Visited on<input type="date" id="vdate" value="${esc(L.date||"")}"></label>
     <label class="f" for="vnote">My review<textarea id="vnote" placeholder="Bitterness, sweetness, texture, what to order next time…">${esc(L.note||"")}</textarea></label>
     <div class="saved" id="saved">${L.updated?"Saved "+new Date(L.updated).toLocaleDateString():""}</div></div>`;
  sh.hidden=false;$("#scrim").hidden=window.innerWidth>=860;
  $("#closeSheet").onclick=closeSheet;$("#tTry").onclick=()=>save(id,{visited:false});
  $("#tVis").onclick=()=>save(id,{visited:true,date:L.date||new Date().toISOString().slice(0,10)});
  $("#rate").querySelectorAll("button").forEach(b=>b.onclick=()=>{const n=+b.dataset.n;save(id,{rating:(state.log[id]?.rating===n?0:n),visited:true})});
  $("#vdate").onchange=e=>save(id,{date:e.target.value},true);
  let tmr;$("#vnote").oninput=e=>{$("#saved").textContent="Writing…";clearTimeout(tmr);tmr=setTimeout(()=>save(id,{note:e.target.value.slice(0,2000)},true),700)};
  renderList();if(fly)flyTo(s,Math.max(V.z,.13))}
function closeSheet(){$("#sheet").hidden=true;$("#scrim").hidden=true;state.sel=null;renderList()}
$("#scrim").onclick=closeSheet;document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#sheet").hidden)closeSheet()});

// ================= Storage: private per-person db, else this browser =================
let col=null;const LS="matcha-log-v1";const writing={};
function lsRead(){try{return JSON.parse(localStorage.getItem(LS)||"{}")}catch(_){return{}}}
function lsWrite(){try{localStorage.setItem(LS,JSON.stringify(state.log))}catch(_){}}
async function save(id,patch,quiet){
  const cur={...(state.log[id]||{}),...patch,updated:Date.now()};state.log[id]=cur;
  if(!quiet)openSpot(id);else{renderList();const sv=$("#saved");if(sv)sv.textContent="Saving…"}
  if(col){while(writing[id])await writing[id];
    writing[id]=col.doc(id).set(cur).catch(e=>{const sv=$("#saved");if(sv)sv.textContent="Couldn't save to your account ("+e.code+"). Kept on this device.";lsWrite()}).finally(()=>{writing[id]=null});await writing[id]}
  else lsWrite();
  const sv=$("#saved");if(sv&&state.sel===id&&!/Couldn't/.test(sv.textContent))sv.textContent="Saved"}
async function initStore(){
  state.log=lsRead();renderList();$("#storeNote").textContent="Your visits and reviews are saved in this browser.";
  try{if(!window.claude?.use)return;const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);if(!db||!user)return;const uid=await user.id();if(!uid)return;
    col=db.collection("data/users/"+uid);
    col.onSnapshot(snap=>{const remote={};snap.docs.forEach(d=>{if(d.exists)remote[d.id]=d.data()});const local=lsRead();
      for(const k in local)if(!remote[k]||(local[k].updated||0)>(remote[k].updated||0)){remote[k]=local[k];col.doc(k).set(local[k]).catch(()=>{})}
      try{localStorage.removeItem(LS)}catch(_){}
      state.log={...remote};renderList();$("#storeNote").textContent="Your visits and reviews are private to you and sync across your devices."},()=>{col=null})}catch(_){col=null}}


// ================= Resizable list (drag the handle) =================
const appEl=document.querySelector(".app"),handle=document.getElementById("handle");
const wide=matchMedia("(min-width:860px)");
const HKEY=()=>wide.matches?"matcha-panel-w":"matcha-drawer-h";
function limits(){const r=appEl.getBoundingClientRect(),hdr=document.querySelector("header").offsetHeight;
  return wide.matches?{min:300,max:Math.max(320,r.width*.6),size:document.querySelector(".drawer").offsetWidth}
                     :{min:64,max:Math.max(120,r.height-hdr-20-110),size:document.querySelector(".drawer").offsetHeight}}
function setSize(px,persist){const {min,max}=limits();px=Math.round(Math.min(max,Math.max(min,px)));
  appEl.style.setProperty(wide.matches?"--panel-w":"--drawer-h",px+"px");handle.setAttribute("aria-valuenow",px);
  if(persist){try{localStorage.setItem(HKEY(),px)}catch(_){}}}
function restoreSize(){appEl.style.removeProperty("--panel-w");appEl.style.removeProperty("--drawer-h");
  handle.setAttribute("aria-orientation",wide.matches?"vertical":"horizontal");
  let v=null;try{v=+localStorage.getItem(HKEY())}catch(_){}if(v)setSize(v)}
let hd=null;
handle.addEventListener("pointerdown",e=>{e.preventDefault();handle.setPointerCapture(e.pointerId);const r=appEl.getBoundingClientRect();
  hd={start:wide.matches?e.clientX:e.clientY,size:limits().size,moved:false,r};handle.classList.add("dragging");document.body.classList.add("resizing");document.body.classList.toggle("cols",wide.matches)});
handle.addEventListener("pointermove",e=>{if(!hd)return;const d=(wide.matches?e.clientX:e.clientY)-hd.start;if(Math.abs(d)>3)hd.moved=true;if(hd.moved)setSize(hd.size-d)});
function endDrag(){if(!hd)return;const moved=hd.moved;hd=null;handle.classList.remove("dragging");document.body.classList.remove("resizing","cols");
  if(moved){setSize(limits().size,true)}else{ // tap: cycle snap points
    const {min,max,size}=limits();const snaps=wide.matches?[340,420,560]:[min,Math.round(max*.45),max];const next=snaps.find(s=>s>size+8)??snaps[0];setSize(next,true)}}
handle.addEventListener("pointerup",endDrag);handle.addEventListener("pointercancel",endDrag);
handle.addEventListener("keydown",e=>{const step=e.shiftKey?80:24,{size}=limits();
  const grow=wide.matches?"ArrowLeft":"ArrowUp",shrink=wide.matches?"ArrowRight":"ArrowDown";
  if(e.key===grow){setSize(size+step,true);e.preventDefault()}else if(e.key===shrink){setSize(size-step,true);e.preventDefault()}});
wide.addEventListener("change",restoreSize);
window.addEventListener("resize",()=>{const {size}=limits();setSize(size)});
restoreSize();

// ================= Boot =================
buildPins();resize();fitTo(SPOTS,40);renderList();initStore();
document.fonts&&document.fonts.ready.then(()=>req());
</script>

</body>
