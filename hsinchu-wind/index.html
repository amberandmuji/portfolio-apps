<title>Twenty Years in the Windy City</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+TC:wght@500;700&display=swap">
<style>
/* Layout: full-bleed WebGL canvas; UI is a thin layer of station-sign cards,
   subtitles and a line map of the four stops. Single dusk look by design. */
:root {
  --night: #11172a;        /* overlay ground */
  --night-2: #1a2238;
  --paper: #f1eadb;        /* text */
  --paper-dim: #b6b0a3;
  --rail-blue: #1f4e8c;    /* station name-board band */
  --rice: #e3c45e;         /* accent: ripening rice */
  --veil: rgba(9, 13, 24, 0.66);

  --f-display: "Instrument Serif", "Iowan Old Style", Georgia, serif;
  --f-body: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --f-zh: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;

  color-scheme: dark;
}

[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--night);
  color: var(--paper);
  font: 15px/1.55 var(--f-body);
  overflow: hidden;
}

#app { position: fixed; inset: 0; }
#app canvas { display: block; width: 100%; height: 100%; }

.layer {
  position: absolute; inset: 0;
  display: grid; place-items: center;
  padding: 24px 16px;
  box-sizing: border-box;
  overflow-y: auto;
}
.veil { background: var(--veil); backdrop-filter: blur(2px); }
.hud { position: absolute; inset: 0; pointer-events: none; }

/* ---------- Title ---------- */
.title { display: grid; gap: 22px; justify-items: center; text-align: center; width: min(40rem, 100%); }
.eyebrow { margin: 0; font: 500 0.95rem var(--f-zh); letter-spacing: 0.5em; margin-right: -0.5em; color: var(--rice); }
.title h1 {
  font: 400 clamp(2.6rem, 6.4vw, 4.4rem)/1.0 var(--f-display);
  letter-spacing: -0.01em; margin: 0; text-wrap: balance;
}
.title .sub { font: 400 1.05rem/1.5 var(--f-body); color: var(--paper-dim); margin: 0; max-width: 30rem; }

.linemap { display: flex; align-items: flex-start; width: 100%; max-width: 32rem; margin-top: 6px; }
.linemap .stop {
  flex: 1; min-width: 0; display: grid; justify-items: center; gap: 4px; position: relative;
  background: none; border: 0; padding: 0; color: var(--paper-dim); cursor: default; font: inherit;
}
.linemap .stop::before {
  content: ""; position: absolute; top: 7px; left: -50%; right: 50%;
  height: 3px; background: var(--paper-dim); opacity: 0.3;
}
.linemap .stop.open::before { background: var(--rice); opacity: 0.9; }
.linemap .stop:first-child::before { display: none; }
.linemap button.stop.open:not(:disabled) { cursor: pointer; }
.linemap button.stop.open:not(:disabled):hover .nm { text-decoration: underline; text-underline-offset: 3px; }
.linemap .dot {
  width: 17px; height: 17px; border-radius: 50%;
  border: 3px solid var(--paper-dim); background: var(--night); position: relative; z-index: 1; box-sizing: border-box;
}
.linemap .stop.open { color: var(--paper); }
.linemap .stop.open .dot { border-color: var(--rice); }
.linemap .nm { font: 500 0.9rem var(--f-body); margin-top: 4px; }
.linemap .yr { font: 0.68rem var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--paper-dim); }

.btn {
  font: 500 1rem var(--f-body); letter-spacing: 0.04em;
  color: #1a1a14; background: var(--rice);
  border: 0; border-radius: 2px; padding: 12px 30px; cursor: pointer;
}
.btn:hover { filter: brightness(1.08); }
.btn:focus-visible, .ghost:focus-visible, select:focus-visible, input:focus-visible, .stop:focus-visible {
  outline: 2px solid var(--paper); outline-offset: 3px;
}
.ghost {
  font: 400 0.88rem var(--f-body); color: var(--paper);
  background: rgba(10, 14, 24, 0.35); border: 1px solid rgba(241, 234, 219, 0.28);
  border-radius: 2px; padding: 10px 16px; cursor: pointer;
}
.ghost:hover { border-color: var(--paper-dim); }
.row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.hint { margin: 0; font: 0.76rem var(--f-mono); color: var(--paper-dim); letter-spacing: 0.03em; }
.hint.dim { opacity: 0.75; }

/* ---------- Station name board ---------- */
.board {
  width: min(34rem, 100%);
  background: #f7f5ef; color: #1b1b1b;
  box-shadow: 0 24px 70px rgba(0,0,0,0.5);
  display: grid; text-align: center;
}
.board .name { padding: 24px 16px 14px; display: grid; gap: 6px; }
.board .name .en { font: 600 clamp(2.2rem, 7vw, 3.2rem)/1 var(--f-body); letter-spacing: 0.02em; }
.board .name .zh { font: 500 1.05rem var(--f-zh); letter-spacing: 0.6em; margin-right: -0.6em; color: #444; }
.board .band {
  background: var(--rail-blue); color: #fff;
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  padding: 10px 14px; font-size: 0.88rem; gap: 10px;
}
.board .band .prev { text-align: left; }
.board .band .next { text-align: right; }
.board .band .mid { font: 0.68rem var(--f-mono); letter-spacing: 0.12em; opacity: 0.85; }
.board .caption { padding: 12px 16px 16px; font: 400 1.25rem var(--f-display); color: #333; }
.kept { margin: 0; font: 0.95rem var(--f-body); }
.kept .k, .toast .k, .hud-obj .k {
  font: 0.66rem var(--f-mono); color: var(--rice); letter-spacing: 0.14em; text-transform: uppercase; margin-right: 8px;
}

/* ---------- HUD ---------- */
.hud-left {
  position: absolute; top: calc(16px + env(safe-area-inset-top, 0px)); left: 16px;
  display: grid; gap: 6px; justify-items: start; max-width: min(24rem, calc(100% - 140px));
}
.hud-obj {
  font: 0.86rem/1.4 var(--f-body); color: var(--paper);
  background: rgba(10,14,24,0.5); padding: 9px 13px; border-left: 3px solid var(--rice);
}
.hud-obj .k { display: block; margin: 0 0 2px; }
.hud-obj.pulse { animation: pulse 1.2s ease-out; }
@keyframes pulse { from { background: rgba(227,196,94,0.35); } to { background: rgba(10,14,24,0.5); } }
.waypoint {
  display: flex; align-items: center; gap: 10px;
  background: rgba(10,14,24,0.5); padding: 6px 12px 6px 8px; border-left: 3px solid var(--rice);
  font: 600 0.86rem var(--f-mono); color: var(--paper);
}
.waypoint .dial { display: inline-grid; place-items: center; width: 30px; height: 30px; color: var(--rice); }
.waypoint .arrow { display: block; transition: transform 0.12s linear; }
.hud-gear { position: absolute; top: calc(16px + env(safe-area-inset-top, 0px)); right: 16px; pointer-events: auto; }
.crosshair {
  position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px;
  background: var(--paper); border-radius: 50%; opacity: 0.6;
}
.prompt {
  position: absolute; left: 50%; top: calc(50% + 28px); transform: translateX(-50%);
  font: 0.88rem var(--f-body); background: rgba(10,14,24,0.62);
  padding: 6px 12px; border-radius: 2px; white-space: nowrap;
}
.prompt kbd {
  font: 0.75rem var(--f-mono); border: 1px solid var(--paper-dim); border-radius: 3px;
  padding: 1px 6px; margin-right: 8px;
}
.subtitle {
  position: absolute; left: 50%; bottom: calc(44px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  width: min(46rem, calc(100% - 32px)); text-align: center;
  transition: opacity 0.5s;
}
.subtitle .line {
  display: inline; font: 400 1.5rem/1.45 var(--f-display);
  background: rgba(8, 11, 20, 0.5); box-decoration-break: clone; -webkit-box-decoration-break: clone;
  padding: 2px 10px;
}
.toast {
  position: absolute; left: 16px; bottom: calc(44px + env(safe-area-inset-bottom, 0px));
  font: 0.9rem var(--f-body); background: rgba(10,14,24,0.65); padding: 10px 14px;
  border: 1px solid rgba(227,196,94,0.5); animation: pulse 1.2s ease-out;
}
.letterbox { position: absolute; inset: 0; pointer-events: none; }
.letterbox i {
  position: absolute; left: 0; right: 0; height: 11vh; background: #05070d;
  transform: scaleY(0); transition: transform 0.9s ease;
}
.letterbox i:first-child { top: 0; transform-origin: top; }
.letterbox i:nth-child(2) { bottom: 0; transform-origin: bottom; }
.letterbox.on i { transform: scaleY(1); }
.letterbox .skip {
  position: absolute; right: 24px; bottom: calc(11vh - 34px); font: 0.74rem var(--f-mono);
  letter-spacing: 0.1em; color: var(--paper-dim); opacity: 0; transition: opacity 0.6s 0.8s;
}
.letterbox.on .skip { opacity: 0.7; }
.hud.cinema .hud-left, .hud.cinema .crosshair, .hud.cinema .prompt, .hud.cinema .hud-gear { display: none; }
.hud.cinema .subtitle { bottom: calc(11vh + 18px); }
.fade { position: absolute; inset: 0; background: #0b0f19; pointer-events: none; opacity: 0; transition: opacity 1.4s ease; }

/* ---------- Settings ---------- */
.panel {
  width: min(24rem, 100%); background: var(--night-2);
  border: 1px solid rgba(241,234,219,0.12); padding: 22px; display: grid; gap: 16px; box-sizing: border-box;
}
.panel h2 { font: 400 1.8rem var(--f-display); margin: 0; }
.field { display: grid; gap: 6px; }
.field label { font: 0.72rem var(--f-mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--paper-dim); }
.field select, .field input[type=range] { width: 100%; }
select {
  font: 0.95rem var(--f-body); color: var(--paper); background: var(--night);
  border: 1px solid rgba(241,234,219,0.25); padding: 7px 8px; border-radius: 2px;
}
input[type=range] { accent-color: var(--rice); }

/* ---------- Small-screen notice ---------- */
.notice { display: grid; gap: 18px; text-align: center; max-width: 24rem; }
.notice h2 { font: 400 2.2rem var(--f-display); margin: 0; }
.notice p { margin: 0; color: var(--paper-dim); }

@media (prefers-reduced-motion: reduce) {
  .fade, .subtitle { transition: none; }
  .hud-obj.pulse, .toast { animation: none; }
}
